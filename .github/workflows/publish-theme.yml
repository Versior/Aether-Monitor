name: Publish theme
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-theme
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build same-origin install for existing URLs
        env:
          API_BASE: ''
          TITLE: ''
          BACKGROUND_IMAGE: ''
          CSP_API: ''
          CSP_STATIC: ''
        run: npm run build -- --outDir "$RUNNER_TEMP/theme-bundle/install"
      - name: Build Pages site
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          CSP_API: ${{ secrets.CSP_API }}
          CSP_STATIC: ${{ secrets.CSP_STATIC }}
        run: npm run build -- --outDir "$RUNNER_TEMP/theme-bundle/pages"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: theme-${{ github.run_attempt }}
          path: ${{ runner.temp }}/theme-bundle/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/theme-bundle
      - name: Append both artifacts to their own histories
        env:
          GH_TOKEN: ${{ secrets.PAGES_PUBLISH_TOKEN || github.token }}
        run: |
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          bash scripts/publish-theme.sh "$RUNNER_TEMP/theme-bundle/pages" "$RUNNER_TEMP/theme-bundle/install"
